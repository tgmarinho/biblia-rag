services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: biblia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblia
      POSTGRES_PASSWORD: biblia
      POSTGRES_DB: biblia
    ports:
      - "5434:5432"
    volumes:
      - biblia-pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblia -d biblia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  biblia-pgdata:
